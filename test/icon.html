<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../katex/katex.min.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #tile {
    width: 512px; height: 512px;
    border-radius: 104px;
    background: linear-gradient(145deg, #161b22 0%, #0d1117 100%);
    box-shadow: inset 0 0 0 12px #30363d;
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box;
  }
  #math .katex { font-size: 120px; color: #58a6ff; }
</style>
<script src="../katex/katex.min.js"></script>
</head>
<body>
<div id="tile"><span id="math"></span></div>
<script>
  try {
    katex.render('\\LaTeX', document.getElementById('math'), { displayMode: false });
    document.title = 'rendered:' + document.getElementById('math').innerHTML.length;
  } catch (e) {
    document.title = 'ERR:' + e.message;
  }
</script>
</body>
</html>
